    <rect x="176" y="238" width="30" height="56" rx="8" fill="#4f9dff"/>
    <rect x="214" y="206" width="30" height="88" rx="8" fill="#7ab6ff"/>
    <rect x="252" y="174" width="30" height="120" rx="8" fill="#ffffff"/>
  </g>
  <!-- Lupa -->
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round">
    <circle cx="228" cy="228" r="118"/>
    <line x1="314" y1="314" x2="392" y2="392"/>
  </g>
