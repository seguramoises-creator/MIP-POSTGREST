<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="VISTA">
  <rect width="512" height="512" rx="112" fill="#0b1e3f"/>
  <rect width="512" height="512" rx="112" fill="url(#g)" opacity="0.35"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1565c0"/>
      <stop offset="1" stop-color="#0b1e3f"/>
