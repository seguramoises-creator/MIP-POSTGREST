# nginx del contenedor frontend: sirve el SPA y hace reverse-proxy de la API
# al servicio "backend" de docker-compose (misma red Docker).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Subidas de Excel (ETL/DIMs) — ETL_MAX_FILE_SIZE_MB=50
    client_max_body_size 100M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API → backend (incluye /api/v1/docs, /api/v1/openapi.json, etc.)
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 600s y no 120s por la integración con Mallén: `POST
        # /integracion/visitas/integrar` es síncrona y procesa el lote entero
        # (~8 ms por fila), así que un lote mensual realista (~21k filas) ronda
        # los 170 s. Con 120 s el operador recibía un 504 en una corrida que SÍ
        # había commiteado, y el reintento dispararía una segunda integración.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Cache de assets con hash (Vite los versiona)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker: SIEMPRE fresco (para que el SW v4 pass-through reemplace de
    # inmediato a cualquier SW viejo atrapado en el dispositivo) + Clear-Site-Data
    # "cache" para que, al revalidarlo, el navegador purgue el CacheStorage donde el
    # SW viejo guardaba chunks obsoletos. "cache" NO borra cookies/localStorage → la
    # sesión del usuario se conserva. Auto-cura la flota (iPhone/Android) sin tocar
    # cada teléfono. (Safari ignora Clear-Site-Data; ahí cura el no-store de arriba.)
    location = /pwa-sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Clear-Site-Data '"cache"' always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # index.html NUNCA se cachea: cada navegación baja el HTML fresco (que apunta a
    # los chunks del deploy actual). Evita que un HTML viejo pida chunks inexistentes.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ── La app de campo (APK) ────────────────────────────────────────────────
    # Va ANTES del catch-all y con `try_files ... =404` a propósito.
    #
    # Sin este bloque, `GET /descargas/vista-campo.apk` caía en la SPA y devolvía
    # `200 text/html`: el index.html con nombre de APK. Un 200 se lee como «existe»,
    # así que la descarga parecía estar puesta cuando no había ningún fichero — y el
    # teléfono se bajaba una página web renombrada. Aquí, si el APK no está, se dice
    # 404, que es lo que de verdad ocurre.
    #
    # El `Content-Type` importa: con el genérico, Android no ofrece instalar.
    location /descargas/ {
        alias /usr/share/nginx/html/descargas/;
        try_files $uri =404;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment' always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA: cualquier ruta desconocida cae en index.html (react-router).
    # También sin caché — la respuesta es el index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
