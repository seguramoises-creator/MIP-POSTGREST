<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCGCPR — Sistema Corporativo</title>
    <!-- PWA (aditivo) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1565c0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VISTA" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Capturador de errores VISIBLE (diagnóstico móvil).
         Muestra en un recuadro rojo, en la propia pantalla del teléfono, cualquier
         error JS no capturado, fallo de carga de recurso/chunk o promesa rechazada.
         Se instala ANTES de main.tsx para atrapar hasta los fallos de arranque.
         Es aditivo y silencioso mientras no haya errores. Botón "Copiar" + "Cerrar". -->
    <script>
      (function () {
        var box;
        function render(titulo, detalle) {
          try {
            if (!box) {
              box = document.createElement('div');
              box.setAttribute('id', '__err_overlay__');
              box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;' +
                'max-height:55vh;overflow:auto;background:#b71c1c;color:#fff;' +
                'font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:12px 12px 10px;' +
                'box-shadow:0 -4px 18px rgba(0,0,0,.4);-webkit-user-select:text;user-select:text';
              var bar = document.createElement('div');
              bar.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;margin-bottom:8px';
              var bCopy = document.createElement('button');
              bCopy.textContent = 'Copiar';
              bCopy.style.cssText = 'padding:6px 12px;border:0;border-radius:6px;background:#fff;color:#b71c1c;font-weight:700';
              bCopy.onclick = function () {
                var t = box.__log || '';
                try { navigator.clipboard.writeText(t); bCopy.textContent = 'Copiado ✓'; }
                catch (e) { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); bCopy.textContent = 'Copiado ✓'; } catch (_) {} ta.remove(); }
              };
              var bClose = document.createElement('button');
              bClose.textContent = 'Cerrar';
              bClose.style.cssText = 'padding:6px 12px;border:0;border-radius:6px;background:rgba(255,255,255,.25);color:#fff;font-weight:700';
              bClose.onclick = function () { box.style.display = 'none'; };
              bar.appendChild(bCopy); bar.appendChild(bClose);
              box.appendChild(bar);
              box.__body = document.createElement('div');
              box.appendChild(box.__body);
              (document.body || document.documentElement).appendChild(box);
            }
            box.style.display = 'block';
            var line = '▸ ' + titulo + (detalle ? '\n' + detalle : '');
            box.__log = (box.__log ? box.__log + '\n\n' : '') + line;
            var pre = document.createElement('pre');
            pre.style.cssText = 'white-space:pre-wrap;word-break:break-word;margin:0 0 10px';
            pre.textContent = line;
            box.__body.appendChild(pre);
          } catch (e) { /* nunca romper por el propio overlay */ }
        }
        window.addEventListener('error', function (ev) {
          if (ev && ev.target && (ev.target.src || ev.target.href) && ev.target.tagName) {
            // Error de carga de recurso (script/css/img) — típico de un chunk 404 tras deploy.
            render('No cargó un recurso: ' + ev.target.tagName + ' ' + (ev.target.src || ev.target.href));
          } else {
            var m = ev && ev.message ? ev.message : 'Error';
            var d = ev && ev.error && ev.error.stack ? ev.error.stack : (ev && ev.filename ? (ev.filename + ':' + ev.lineno + ':' + ev.colno) : '');
            render(m, d);
          }
        }, true); // captura: atrapa también errores de carga de recursos
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev && ev.reason;
          var m = r && r.message ? r.message : ('Promesa rechazada: ' + String(r));
          var d = r && r.stack ? r.stack : '';
          render(m, d);
        });
      })();
    </script>
    <!-- Medidor de diagnóstico (HUD). Se activa SOLO con ?diag=1 en la URL y persiste
         hasta ?diag=0. Muestra memoria JS (heap), ruta actual, nº de navegaciones y un
         reloj que se actualiza cada 500 ms. Si el reloj se detiene, ahí se congeló, y el
         heap de ese momento revela si fue agotamiento de memoria del teléfono. Invisible
         para los usuarios normales. En iOS `performance.memory` no existe → muestra "?",
         pero reloj/ruta/nav siguen sirviendo para ubicar el instante del congelamiento. -->
    <script>
      (function () {
        try {
          if (/[?&]diag=0/.test(location.search)) { localStorage.removeItem('vista_diag'); return; }
          var on = /[?&]diag=1/.test(location.search) || localStorage.getItem('vista_diag') === '1';
          if (!on) return;
          try { localStorage.setItem('vista_diag', '1'); } catch (e) {}
        } catch (e) { return; }
        var nav = 0;
        try {
          var _ps = history.pushState;
          history.pushState = function () { nav++; return _ps.apply(this, arguments); };
          window.addEventListener('popstate', function () { nav++; });
        } catch (e) {}
        var hud = document.createElement('div');
        hud.style.cssText = 'position:fixed;top:0;left:0;z-index:2147483646;background:rgba(0,0,0,.82);' +
          'color:#39ff14;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;padding:4px 7px;' +
          'pointer-events:none;max-width:72vw;border-bottom-right-radius:6px;white-space:pre';
        function mb(n) { return Math.round(n / 1048576); }
        function upd() {
          var m = performance.memory;
          var heap = m ? (mb(m.usedJSHeapSize) + '/' + mb(m.jsHeapSizeLimit) + 'MB') : 'heap n/d';
          var t = new Date();
          var hh = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
          hud.textContent = 'DIAG ' + hh + '  ' + heap + '  nav:' + nav + '\n' + location.pathname;
        }
        function boot() { (document.body || document.documentElement).appendChild(hud); upd(); setInterval(upd, 500); }
        if (document.body) boot(); else window.addEventListener('DOMContentLoaded', boot);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- PWA: registro del service worker (aditivo, tolerante a fallos).
         Relevo limpio: cuando un SW NUEVO toma control, recarga UNA vez para servir el
         bundle fresco — evita que un SW viejo siga sirviendo index/chunks obsoletos
         (la causa del congelamiento en móvil/PWA tras un deploy). -->
    <script>
      if ('serviceWorker' in navigator) {
        var _swRecargando = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (_swRecargando) return;
          _swRecargando = true;
          window.location.reload();
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/pwa-sw.js').then(function (reg) {
            if (reg && reg.update) reg.update().catch(function () {}); // busca versión nueva
          }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
