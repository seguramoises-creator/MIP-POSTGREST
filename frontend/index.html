<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCGCPR — Sistema Corporativo</title>
    <!-- PWA (aditivo) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1565c0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VISTA" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- PWA: registro del service worker (aditivo, tolerante a fallos).
         Relevo limpio: cuando un SW NUEVO toma control, recarga UNA vez para servir el
         bundle fresco — evita que un SW viejo siga sirviendo index/chunks obsoletos
         (la causa del congelamiento en móvil/PWA tras un deploy). -->
    <script>
      if ('serviceWorker' in navigator) {
        var _swRecargando = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (_swRecargando) return;
          _swRecargando = true;
          window.location.reload();
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/pwa-sw.js').then(function (reg) {
            if (reg && reg.update) reg.update().catch(function () {}); // busca versión nueva
          }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
