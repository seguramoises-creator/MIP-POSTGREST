<?xml version="1.0" encoding="UTF-8"?>
<!--
  La CAPA DE FONDO del icono: el azul profundo de VISTA, liso.

  Antes aquí seguía el logotipo de .NET de la plantilla, y no se notaba: en Android 8
  para arriba el lanzador dibuja el icono ADAPTATIVO (fondo + primer plano por separado)
  y el primer plano ya era la lupa, así que en el teléfono se veía bien. Esta imagen es
  la que se usa en todo lo demás —lanzadores viejos, algunas notificaciones, la ficha de
  la tienda—, y ahí la app se presentaba con el logotipo de Microsoft.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <rect width="456" height="456" fill="#011D42" />
</svg>
