# ═══════════════════════════════════════════════════════════════
# MSM / VISTA (SCGCPR) — orquestación Docker · EDICIÓN PostgreSQL
# ───────────────────────────────────────────────────────────────
# App (backend + frontend), usando una BD PostgreSQL EXTERNA/gestionada
# (configurada en backend/.env):
#     docker compose up -d --build
#
# Incluyendo un PostgreSQL en contenedor (perfil "with-db"):
#     export POSTGRES_PASSWORD='Una.Clave.Fuerte123'
#     docker compose --profile with-db up -d --build
#     # y en backend/.env: DB_SERVER=db  DB_PORT=5432  DB_USER=segura  DB_PASSWORD=$POSTGRES_PASSWORD
#
# Abrir:  http://<servidor>/         (frontend)
#         http://<servidor>/api/v1/docs  (Swagger vía proxy)
# ═══════════════════════════════════════════════════════════════
services:
  backend:
    build: ./backend
    image: msm-backend:latest
    env_file: ./backend/.env          # toda la config de la app (DB_*, JWT, MAIL, ANTHROPIC, CORS)
    environment:
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-1}"   # 1 = corre alembic upgrade head al arrancar
    volumes:
      - backend_uploads:/app/uploads
      - backend_reports:/app/reports
      - backend_logs:/app/logs
    expose:
      - "8000"                        # solo visible dentro de la red Docker (no se publica)
    depends_on:
      db:
        condition: service_healthy
        required: false               # el perfil "with-db" activa el servicio db; sin él, se ignora
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1         # same-origin: nginx del frontend hace proxy al backend
    image: msm-frontend:latest
    ports:
      # Puerto del host → 80 del contenedor. Configurable para NO chocar con otros
      # stacks en el mismo servidor (p.ej. srv1772225 con DW/Odoo). El nginx del host
      # (TLS/certbot) hace proxy 443 → 127.0.0.1:${FRONTEND_PORT}. Ver DEPLOY-POSTGRES.md.
      # El prefijo 127.0.0.1 es DELIBERADO: sin él Docker publica el puerto en TODAS las
      # interfaces y el frontend queda alcanzable desde internet por ese puerto, saltándose
      # el nginx del host y con él el TLS. Atado a loopback, el único que llega es el proxy.
      - "127.0.0.1:${FRONTEND_PORT:-8090}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # PostgreSQL OPCIONAL (perfil "with-db"). Para producción real conviene una BD
  # gestionada con respaldos (RDS, Cloud SQL, etc.); este servicio es para
  # entornos self-hosted / prueba. El healthcheck permite que el backend espere
  # a que la BD esté lista antes de correr las migraciones (depends_on healthy).
  db:
    image: postgres:17
    profiles: ["with-db"]
    environment:
      POSTGRES_DB: "${DB_NAME:-scgcpr}"
      POSTGRES_USER: "${DB_USER:-segura}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD (clave fuerte) para el perfil with-db}"
    # TLS AUTO-ACTIVADO SI HAY CERTIFICADO (§8.1 del requerimiento de Mallén: la
    # integración conecta con `sslmode=require`). El condicional NO es adorno: si
    # se pusiera `-c ssl=on` fijo, cualquier despliegue sin certificados dejaría a
    # PostgreSQL sin arrancar — y con él toda la aplicación. Así, un servidor sin
    # `certs/postgres/server.crt` arranca exactamente como siempre.
    # Generar los certificados con: scripts/integracion/generar_certificado_pg.sh
    # OJO con la indentación: en un bloque YAML `>` las líneas MÁS indentadas que
    # la primera conservan su salto de línea en vez de plegarse. Si los `-c ssl=on`
    # se indentan bajo el `exec`, el shell los toma como comandos sueltos y no como
    # argumentos: PostgreSQL arranca SIN TLS mientras el log dice que sí. Todas las
    # líneas van al mismo nivel a propósito.
    command: >
      bash -c 'if [ -f /certs/server.crt ] && [ -f /certs/server.key ]; then
      echo "TLS habilitado (certificado encontrado en /certs)";
      exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key;
      else
      echo "TLS deshabilitado (sin certificado en /certs) - normal fuera del ambiente de Mallen";
      exec docker-entrypoint.sh postgres;
      fi'
    # El 5432 NO se publica aquí, a propósito: el backend llega por la red interna
    # de compose (host `db`), y publicarlo chocaría con cualquier otro PostgreSQL
    # del servidor — en el piloto hay uno escuchando en el 5432 del host, así que
    # añadirlo aquí dejaría este contenedor sin arrancar.
    # El ambiente de Mallén, donde el SQL Server SÍ debe alcanzarlo, lo publica con
    # el override `docker-compose.integracion.yml`. Ver scripts/integracion/README.md.
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Certificados TLS. Si el directorio está vacío, el arranque de arriba lo
      # detecta y sigue sin TLS.
      - ./certs/postgres:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-segura} -d ${DB_NAME:-scgcpr}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_reports:
  backend_logs:
  pg_data:
