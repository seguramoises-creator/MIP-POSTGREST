  # ─── RECONOCIMIENTO ───────────────────────────────────────────────────────

  /reconocimiento:
    get:
      tags: [Reconocimiento]
      summary: Reconocimientos otorgados
      parameters:
        - name: pais_id
          in: query
          schema: { type: integer }
        - name: ciclo_id
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: Lista de reconocimientos }
    post:
      tags: [Reconocimiento]
      summary: Registrar nuevo reconocimiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rm_id, premio_id, ciclo_id]
              properties:
                rm_id:     { type: integer }
                premio_id: { type: integer }
                ciclo_id:  { type: integer }
      responses:
        '201': { description: Reconocimiento registrado }
        '400': { description: RM no elegible }

  # ─── HEALTH ───────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [Sistema]
      summary: Estado del servidor y conexión a BD
      security: []
      responses:
        '200':
          description: Sistema saludable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:   { type: string, example: ok }
                  database: { type: string, example: connected }
                  version:  { type: string }

