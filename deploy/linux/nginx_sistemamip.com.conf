# ═══════════════════════════════════════════════════════════════════
# MSM / SCGCPR — nginx reverse proxy para https://sistemamip.com
# ═══════════════════════════════════════════════════════════════════
# Copiar a /etc/nginx/sites-available/sistemamip.com.conf y enlazar:
#   sudo ln -s /etc/nginx/sites-available/sistemamip.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificado SSL (Let's Encrypt, recomendado):
#   sudo certbot --nginx -d sistemamip.com -d www.sistemamip.com
#   (certbot reescribe automáticamente los bloques ssl_certificate de abajo)
# ═══════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name sistemamip.com www.sistemamip.com;

    # Redirección permanente a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sistemamip.com www.sistemamip.com;

    # Certificados (ajustar ruta si no se usa certbot)
    ssl_certificate     /etc/letsencrypt/live/sistemamip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemamip.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /opt/msm/frontend/dist;
    index index.html;

    # Subida de archivos ETL/DIMs (Excel, ver ETL_MAX_FILE_SIZE_MB=50)
    client_max_body_size 100M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Proxy inverso: API (incluye /api/v1/docs, /api/v1/redoc, /api/v1/openapi.json)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── Proxy inverso: health check
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Archivos estáticos del build de Vite + fallback SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets versionados (hash en el nombre de archivo)
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
