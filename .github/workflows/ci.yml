name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancela runs anteriores del mismo ref si llega uno nuevo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        # La suite es independiente de la BD (usa dobles de prueba), pero
        # config.py carga settings al importar: damos valores dummy para que
        # no dependa de un .env (que nunca se versiona).
        env:
          APP_ENV: development
          DB_PASSWORD: dummy
          JWT_SECRET_KEY: ci-secret-key-min-16-chars
        run: python -m pytest -q

  frontend:
    name: Frontend (build + type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build (tsc -b && vite build)
        run: npm run build
